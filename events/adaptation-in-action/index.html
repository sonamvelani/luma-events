<html lang="en">
<head>
<meta charset="UTF-8">

<title>Adaptation in Action · Attendees</title>
<style>
  :root {
    --forest:  #2c4a38;
    --brand:   #3d7a55;
    --bg:      #f3f2ec;
    --card:    #ffffff;
    --border:  #dce3da;
    --text:    #1a2820;
    --muted:   #5c6e60;
    --met:     #2c6644;
    --skip:    #b83030;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }

  header {
    background: var(--forest); color: #e8f0eb; padding: 22px 36px;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  header p  { font-size: 12px; color: #9dbfaa; margin-top: 4px; }
  .luma-link {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
    padding: 5px 11px; border-radius: 5px; border: 1px solid rgba(157,191,170,.4);
    font-size: 11px; font-weight: 500; color: #c8dfd0; text-decoration: none;
    transition: background .12s;
  }
  .luma-link:hover { background: rgba(255,255,255,.08); color: #e8f0eb; }
  .event-meta {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 0; font-size: 12px; font-weight: 500; color: #c8dfd0;
  }

  .toolbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 36px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    box-shadow: 0 1px 3px rgba(44,74,56,.04);
  }
  .toolbar input, .toolbar select {
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px;
    font-size: 13px; color: var(--text); background: var(--bg); outline: none;
    font-family: inherit;
  }
  .toolbar input { width: 210px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--brand); }
  .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }

  .linkedin-batch { background: var(--card); border-bottom: 1px solid var(--border); }
  .linkedin-batch summary {
    padding: 11px 36px; display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); cursor: pointer; list-style: none; font-size: 12px; font-weight: 600;
  }
  .linkedin-batch summary::-webkit-details-marker { display: none; }
  .linkedin-batch summary::after { content: '+'; font-size: 18px; font-weight: 400; line-height: 1; }
  .linkedin-batch[open] summary::after { content: '−'; }
  .linkedin-batch[open] summary { border-bottom: 1px solid var(--border); }
  .batch-btns { padding: 12px 36px; display: flex; gap: 8px; flex-wrap: wrap; }
  .batch-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 5px;
    padding: 7px 14px; font-size: 12px; color: var(--muted); cursor: pointer;
    font-family: inherit; transition: all .12s;
  }
  .batch-btn:hover { border-color: var(--brand); color: var(--brand); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 760px; }
  thead th {
    background: var(--card); text-align: left; padding: 10px 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); border-bottom: 2px solid var(--border); cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { margin-left: 4px; opacity: .35; }
  thead th.sorted .sort-arrow { opacity: 1; color: var(--brand); }
  thead th.no-sort { cursor: default; }
  thead th.no-sort:hover { color: var(--muted); }
  tbody tr { border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr.main-row:hover { background: #eef1ed; }
  tbody tr.skip-row { opacity: 0.35; }
  td { padding: 12px 14px; }

  .action-cell { width: 48px; text-align: center; padding: 12px 6px; vertical-align: middle; }
  .action-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer; font-size: 14px; display: inline-flex;
    align-items: center; justify-content: center; transition: all .15s;
    color: #b0bdb3; font-weight: 700;
  }
  .action-btn:hover { border-color: var(--muted); color: var(--muted); }
  .action-btn.state-met  { background: var(--met);  border-color: var(--met);  color: #fff; }
  .action-btn.state-skip { background: var(--skip); border-color: var(--skip); color: #fff; }

  .identity-cell { width: 230px; vertical-align: middle; overflow: hidden; }
  .identity-inner { display: flex; align-items: flex-start; gap: 10px; }
  .photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    background: #dde5db; display: block; flex-shrink: 0; margin-top: 2px; }
  .identity-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name-line { display: flex; align-items: center; gap: 5px; }
  .person-name { font-weight: 600; font-size: 13.5px; line-height: 1.25; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 185px; }
  .company-line { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--brand); font-weight: 500; overflow: hidden; }
  .company-line span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .company-logo { width: 13px; height: 13px; border-radius: 2px; object-fit: contain; flex-shrink: 0; }
  .title-line { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 195px; }
  .li-badge { display: inline-flex; align-items: center; flex-shrink: 0; }
  .li-badge svg { display: block; }
  .li-link { text-decoration: none; }

  .about-cell {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    cursor: pointer; padding-right: 20px;
  }
  .about-cell:hover .about-snippet { color: var(--text); }
  .about-snippet {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color .12s;
  }
  .expand-hint {
    display: inline-block; margin-top: 4px; font-size: 11px;
    color: var(--brand); letter-spacing: .01em;
  }
  .about-full { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .notes-wrap { margin-top: 12px; }
  .notes-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin-bottom: 5px;
  }
  .notes-input {
    width: 100%; min-height: 52px; resize: vertical;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg);
    outline: none; line-height: 1.5; transition: border-color .12s;
  }
  .notes-input:focus { border-color: var(--brand); background: var(--card); }
  .notes-input::placeholder { color: #b0bdb3; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; width: max-content;
    max-width: 100%; min-height: 25px; padding: 4px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: .01em;
    white-space: nowrap; text-align: center; line-height: 1.2;
  }
  .type-cell { width: 170px; vertical-align: middle; text-align: center; }
  .status-cell { width: 112px; vertical-align: middle; text-align: center; }
  .pill-vc         { background: #cce5d6; color: #1a4d2e; }
  .pill-lp         { background: #d0e8de; color: #1e5235; }
  .pill-founder    { background: #f5e6c8; color: #7a4a10; }
  .pill-policy     { background: #d0e8e4; color: #0f4040; }
  .pill-ngo        { background: #dbe8d0; color: #2e4d1a; }
  .pill-consultant { background: #e6dff0; color: #4a2a70; }
  .pill-academic   { background: #f0dde8; color: #6a1a40; }
  .pill-other      { background: #ece6d8; color: #5a4a20; }
  .pill-unknown    { background: #e8e8e2; color: #5a5a52; }
  .pill-confirmed  { background: #cce5d6; color: #1a4d2e; }
  .pill-guessed    { background: #f5e9c0; color: #7a5e10; }
  .pill-na         { background: #e8e8e2; color: #5a5a52; }

  .empty-state {
    text-align: center; padding: 56px 32px; color: var(--muted); font-size: 14px;
  }

  @media (max-width: 640px) {
    header, .toolbar, .batch-btns { padding-left: 16px; padding-right: 16px; }
    .linkedin-batch summary { padding-left: 16px; padding-right: 16px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input, .toolbar select { width: 100%; }
    .count { margin-left: 0; }
  }
</style>
</head>

"company_domain": ""}, {"slug": "gst-wrcoo5cry9eqxo1", "photo": "", "name": "Vivian Cai", "linkedin": "https://linkedin.com/in/liqiongcai", "status": "Confirmed", "type": "Unknown", "about": "Profile research pending.", "title": "CEO", "company": "Sustentra", "company_domain": ""}, {"slug": "gst-j9nuehiahkh9086", "photo": "", "name": "William D Lese", "linkedin": "https://linkedin.com/in/william-lese-9312603", "status": "Confirmed", "type": "Unknown", "about": "Profile research pending.", "title": "Managing Partner", "company": "Braemar Energy Ventures", "company_domain": ""}, {"slug": "gst-sss9rydqgq3jhex", "photo": "", "name": "Yannick Wurm", "linkedin": "https://linkedin.com/in/sectgenomics", "status": "Confirmed", "type": "Unknown", "about": "Profile research pending.", "title": "Programme Director + Founder", "company": "ARIA + Sensibee", "company_domain": ""}, {"slug": "gst-gutie2pthwbmphv", "photo": "", "name": "Yuan Liu", "linkedin": "https://linkedin.com/in/yuanliurbvc", "status": "Confirmed", "type": "Unknown", "about": "Profile research pending.", "title": "Investment Director", "company": "Bosch Ventures", "company_domain": ""}, {"slug": "gst-hnkgaov3awtckd6", "photo": "", "name": "Zhufang Shi", "linkedin": "https://linkedin.com/in/zhufang-shi", "status": "Confirmed", "type": "Unknown", "about": "Profile research pending.", "title": "Senior Development Manager", "company": "World Resources Institute", "company_domain": ""}];

const TYPE_ORDER = {'VC':0,'LP':1,'Founder/Operator':2,'Policy':3,'NGO':4,'Academic/Research':5,'Consultant/Advisor':6,'Other':7,'Unknown':8};
const EVENT_PREFIX = 'adaptation_in_action_';

const state = {};
DATA.forEach(a => {
  const key = EVENT_PREFIX + a.slug;
  const stored = JSON.parse(localStorage.getItem(key) || 'null');
  state[a.slug] = stored || { met: false, skip: false, expanded: false, notes: '' };
});

function saveState(slug) { localStorage.setItem(EVENT_PREFIX + slug, JSON.stringify(state[slug])); }

function cycleAction(slug) {
  const s = state[slug];
  if (!s.met && !s.skip)       { s.met = true; }
  else if (s.met)              { s.met = false; s.skip = true; }
  else                         { s.skip = false; }
  saveState(slug);
  render();
}

function toggleExpand(slug) {
  state[slug].expanded = !state[slug].expanded;
  saveState(slug);
  render();
}

function saveNotes(slug) {
  const el = document.getElementById('notes_' + slug);
  if (el) { state[slug].notes = el.value; saveState(slug); }
}

function mkSvg() {
  const artwork = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" rx="40" fill="#e1e9e2"/><circle cx="40" cy="30" r="13" fill="#8ba192"/><path d="M18 72c2-15 11-23 22-23s20 8 22 23" fill="#8ba192"/></svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(artwork)}`;
}

const liSvg = (color) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="${color}"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`;

function liIcon(linkedin, status) {
  if (!linkedin) return `<span class="li-badge" style="opacity:.2">${liSvg('#9dbfaa')}</span>`;
  const color = status === 'Confirmed' ? '#0a66c2' : '#9dbfaa';
  return `<a href="${linkedin}" target="_blank" class="li-link li-badge">${liSvg(color)}</a>`;
}

function typePill(t) {
  const cls = {'VC':'vc','LP':'lp','Founder/Operator':'founder','Policy':'policy','NGO':'ngo','Academic/Research':'academic','Consultant/Advisor':'consultant','Other':'other','Unknown':'unknown'}[t]||'unknown';
  return `<span class="pill pill-${cls}">${t}</span>`;
}

function statusPill(s) {
  const cls = {'Confirmed':'confirmed','Guessed':'guessed','N/A':'na'}[s]||'na';
  return `<span class="pill pill-${cls}">${s}</span>`;
}

let sortCol = null, sortDir = 1;

function render() {
  const q  = document.getElementById('search').value.toLowerCase();
  const tf = document.getElementById('typeFilter').value;
  const sf = document.getElementById('statusFilter').value;
  const mf = document.getElementById('metFilter').value;

  let filtered = DATA.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !(a.about||'').toLowerCase().includes(q)) return false;
    if (tf && a.type !== tf) return false;
    if (sf && a.status !== sf) return false;
    if (mf === 'met'  && !state[a.slug].met)  return false;
    if (mf === 'skip' && !state[a.slug].skip) return false;
    return true;
  });

  if (sortCol) {
    filtered.sort((a,b) => {
      let av = a[sortCol]||'', bv = b[sortCol]||'';
      if (sortCol==='type') { av = TYPE_ORDER[av]??9; bv = TYPE_ORDER[bv]??9; return (av-bv)*sortDir; }
      return String(av).localeCompare(String(bv))*sortDir;
    });
  } else {
    filtered.sort((a,b) => (TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9) || a.name.localeCompare(b.name));
  }

  document.getElementById('countLabel').textContent = `${filtered.length} of ${DATA.length}`;

  const tbody = document.getElementById('tbody');
  const liUrls = filtered.filter(a => a.linkedin).map(a => a.linkedin);
  document.getElementById('linkedinCount').textContent = `(${liUrls.length})`;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No attendees match your filters.</td></tr>`;
    document.getElementById('batchBtns').innerHTML = '';
    return;
  }

  tbody.innerHTML = filtered.map(a => {
    const photoSrc = a.photo || mkSvg();
    const s = state[a.slug];
    const rowCls    = s.skip ? 'skip-row' : '';
    const actionCls = s.met ? 'state-met' : s.skip ? 'state-skip' : '';
    const actionLbl = s.met ? '✓' : s.skip ? '✗' : '';

    const hasAbout = !!a.about;

    let aboutContent;
    if (s.expanded) {
      aboutContent = `
        <div class="about-full">${hasAbout ? a.about : '<span style="color:#b0bdb3">—</span>'}</div>
        <div class="notes-wrap">
          <div class="notes-label">Notes</div>
          <textarea class="notes-input" id="notes_${a.slug}" placeholder="Add a note…"
            oninput="saveNotes('${a.slug}')"
            onclick="event.stopPropagation()">${s.notes||''}</textarea>
        </div>`;
    } else {
      const longEnough = hasAbout && a.about.length > 180;
      aboutContent = `
        <div class="about-snippet">${hasAbout ? a.about : '<span style="color:#b0bdb3">—</span>'}</div>
        ${longEnough ? `<span class="expand-hint">↓ more</span>` : ''}`;
    }

    return `<tr class="main-row ${rowCls}">
      <td class="action-cell">
        <button class="action-btn ${actionCls}" onclick="cycleAction('${a.slug}')" title="Cycle: unset → met → skip">${actionLbl}</button>
      </td>
      <td class="identity-cell">
        <div class="identity-inner">
          <img class="photo" src="${photoSrc}" alt="${a.name}" onerror="this.src='${mkSvg()}'">
          <div class="identity-text">
            <div class="name-line">
              ${liIcon(a.linkedin, a.status)}
              <span class="person-name">${a.name}</span>
            </div>
            ${a.company ? `<div class="company-line">${a.company_domain ? `<img class="company-logo" src="https://logo.clearbit.com/${a.company_domain}" onerror="this.style.display='none'">` : ''}<span>${a.company}</span></div>` : ''}
            ${a.title ? `<div class="title-line">${a.title}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="type-cell">${typePill(a.type)}</td>
      <td class="about-cell" onclick="toggleExpand('${a.slug}')">
        ${aboutContent}
      </td>
      <td class="status-cell">${statusPill(a.status)}</td>
    </tr>`;
  }).join('');

  const batchBtns = document.getElementById('batchBtns');
  batchBtns.innerHTML = '';
  for (let i = 0; i < liUrls.length; i += 10) {
    const batch = liUrls.slice(i, i+10);
    const btn = document.createElement('button');
    btn.className = 'batch-btn';
    btn.textContent = `Open LinkedIn ${i+1}–${Math.min(i+10, liUrls.length)}`;
    btn.onclick = (function(urls) {
      return function() {
        const script = urls.map(u => `window.open(${JSON.stringify(u)},'_blank');`).join('');
        const page = `<html><body><script>window.onload=function(){${script}window.close();}<\/script><p style="font-family:sans-serif;padding:20px">Opening ${urls.length} tabs…</p></body></html>`;
        window.open(URL.createObjectURL(new Blob([page],{type:'text/html'})),'_blank');
      };
    })(batch);
    batchBtns.appendChild(btn);
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('metFilter').addEventListener('change', render);

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  });
});

render();
</script>
