<title>Catalyze NYC Happy Hour · Aug 2026</title>
<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .luma-link {

  .batch-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 5px;

  .batch-btn:hover { border-color: var(--brand); color: var(--brand); }
  table { width: 100%; border-collapse: collapse; }

  thead th.no-sort:hover { color: var(--muted); }

  .notes-input {
    width: 100%; min-height: 52px; resize: vertical;

  .pill-ngo        { background: #d0e8e4; color: #0f4040; }
  .pill-other      { background: #dfe4ea; color: #40505c; }
  .pill-founder    { background: #f5e6c8; color: #7a4a10; }
  .pill-policy     { background: #d0e8e4; color: #0f4040; }
  .pill-consultant { background: #e6dff0; color: #4a2a70; }
  .pill-academic   { background: #f0dde8; color: #6a1a40; }
  .pill-unknown    { background: #e8e8e2; color: #5a5a52; }
  .pill-confirmed  { background: #d1fae5; color: #065f46; }
  .pill-guessed    { background: #fef9c3; color: #854d0e; }
  .pill-na         { background: #f3f4f6; color: #6b7280; }
  .empty-state { text-align: center; padding: 56px 32px; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) {
    header, .toolbar, .batch-btns { padding-left: 16px; padding-right: 16px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input, .toolbar select { width: 100%; }
    .count { margin-left: 0; }
  }
</style>

const DATA = [{"slug": "sonamvelani", "photo": "photos/sonamvelani.jpg", "name": "Sonam Velani", "linkedin": "https://www.linkedin.com/in/sonamvelani", "status": "Confirmed", "type": "VC", "about": "Sonam Velani is Co-Founder and Managing Partner of Streetlife Ventures, a seed-stage venture firm investing in the nuts and bolts of sustainable cities. Streetlife backs B2B pre-seed and seed companies across North America and Europe in mobility, buildings, water and waste, energy, and adaptation, with a portfolio of 12+ including Rhizome, DaisyChain Energy and Harvest Thermal. She previously financed $10 billion of transportation, energy and water infrastructure at Goldman Sachs, built coastal protection systems in Asia at the World Bank, launched drone mobility in Africa at Zipline, and developed New York City's $15 billion Green New Deal at the Mayor's Office. She co-founded Climate Tech Cities and sits on the boards of Scale for Climate Tech and Women.NYC. Born in Mumbai and raised in Chicago, she attended Harvard on a full scholarship. Named to Crain's 40 Under 40 and Business Insider's top 10 women leaders solving the climate crisis; has travelled to 70 countries.", "title": "Co-Founder & Managing Partner", "company": "Streetlife Ventures"}, {"slug": "alberto", "photo": "", "name": "Alberto", "linkedin": "", "status": "N/A", "type": "Unknown", "about": "This guest registered under a first name only and has no linked Luma profile details, so no LinkedIn match could be confirmed. Catalyze convenes capital entrepreneurs, meaning emerging fund managers, allocators, and the service providers who support them, so most attendees at this happy hour fall into one of those groups. Worth asking in person which firm they are with. No public profile was identified with enough confidence to list here.", "title": "", "company": ""}, {"slug": "albertomdearenaza", "photo": "photos/albertomdearenaza.jpg", "name": "Alberto Arenaza", "linkedin": "https://www.linkedin.com/in/albertomdearenaza", "status": "Guessed", "type": "VC", "about": "Alberto Arenaza is Co-Founder of Transcend Network and Managing Partner of the Transcend Fund, a venture fund and founder community focused on the future of education and work. The Transcend Fund invests at pre-seed and seed into future-of-work and future-of-learning companies, and came out of VC Lab, the accelerator for first-time fund managers, so it is an early-vintage vehicle. Transcend Network has worked with roughly 600 early-stage founders in the learning and work space, running programs on company building and funding strategy. He was previously an analyst at EH Global Capital covering M&A, capital raising, and early-stage investments. Transcend went through VC Lab, the accelerator program for emerging fund managers. He was part of the inaugural class at Minerva University and is a Forbes 30 Under 30 honoree. He writes frequently on edtech fundraising and alternative funding models for founders, and is based in Madrid.", "title": "Co-Founder & Managing Partner", "company": "Transcend Network"}, {"slug": "allie", "photo": "", "name": "Allie", "linkedin": "", "status": "N/A", "type": "Unknown", "about": "This guest registered under a first name only, so no LinkedIn profile could be matched with confidence. The Catalyze community centers on capital entrepreneurs, so she is most likely an emerging manager, allocator, or ecosystem partner. Ask in person which firm or fund she is with. No public profile is listed here to avoid a wrong match.", "title": "", "company": ""}, {"slug": "feldmanamanda", "photo": "photos/feldmanamanda.jpg", "name": "Amanda Feldman", "linkedin": "https://www.linkedin.com/in/feldmanamanda", "status": "Guessed", "type": "LP", "about": "Amanda Feldman is Managing Director and Head of Impact Engagement at Sonen Capital, an impact investment firm that drives private capital toward social and environmental outcomes alongside financial return. Sonen Capital manages multi-asset impact portfolios for foundations, family offices, and individuals, which puts her on the manager-selection and allocation side rather than investing directly into companies. Her career spans impact measurement, ESG, and blended finance, including work as Technical Lead on Impact Transparency at the Global Steering Group for Impact Investment and Engagement Lead for SDG Impact at UNDP. She co-founded The Predistribution Initiative and Heliotropy, and previously served as an ESG Specialist at FSN Capital covering private equity. She has advised maze impact and sat on the audit committee of The Private Infrastructure Development Group. She holds a BA from the University of Pennsylvania and studied at the London School of Economics, and is based in New York.", "title": "Managing Director, Head of Impact Engagement", "company": "Sonen Capital"}, {"slug": "amberillig", "photo": "photos/amberillig.jpg", "name": "Amber Illig", "linkedin": "https://www.linkedin.com/in/amberillig", "status": "Confirmed", "type": "VC", "about": "Amber Illig is General Partner at The Council, an early-stage venture fund she runs out of San Francisco. The Council is an early-stage fund writing pre-seed and seed checks, with an LP base drawn heavily from her former Cruise, Apple, and Snap colleagues, and she layers selective SPVs on top for strong follow-ons. She spent the first half of her career on factory floors at Sanmina, Flextronics, Foxconn, Pegatron, and Jabil Nypro while working for Eli Lilly, Apple, Snap, and Delta Faucet, then moved to Cruise, where many former colleagues are now her LPs or portfolio founders. She runs SPVs selectively alongside the core fund when there is a strong follow-on or co-invest opportunity, and shares carry with team members who work on ops and diligence. Recent portfolio activity includes Rosarium Health. She is a member of the Catalyze 2026 cohort and studied at Purdue University.", "title": "General Partner", "company": "The Council"}, {"slug": "andrew-brown-6145a454", "photo": "photos/andrew-brown-6145a454.jpg", "name": "Andrew Brown", "linkedin": "https://www.linkedin.com/in/andrew-brown-6145a454", "status": "Confirmed", "type": "Consultant/Advisor", "about": "Andrew Brown provides outsourced CFO services and back-office support to venture capital funds through Nakama Venture Solutions. Nakama sells outsourced fund CFO and administration services to venture funds, competing directly with Carta, Fidelity, and Standish, all of which are represented in this room. He has fifteen years in venture fund administration and has worked with well over 1,000 funds across sizes, strategies, and structures. He co-founded Carta's fund administration team and also founded Carta's pre-close team, which specialized in fund formation and one-on-one consultation for emerging fund managers. His specialty is applying institutional-grade practices and procedures at scale to funds of any size. He studied at Rider University and is based in Langhorne, Pennsylvania.", "title": "CFO for Venture Capitalists", "company": "Nakama Venture Solutions"}, {"slug": "ashlietyler", "photo": "photos/ashlietyler.jpg", "name": "Ashlie Tyler", "linkedin": "https://www.linkedin.com/in/ashlietyler", "status": "Confirmed", "type": "LP", "about": "Ashlie Tyler is a senior investment officer at Bank of America, where she has helped design and scale the firm's roughly $550 million private markets investment platform since 2020. Bank of America's private markets platform is institutional capital at roughly $550 million, committing across strategies and vintages, so she is an institutional LP rather than a family office or individual allocator. Her work spans the full investment lifecycle: sourcing and underwriting fund commitments, leading diligence, constructing and pacing a diversified portfolio across strategies and vintages, and managing GP relationships and investment committee processes across more than 150 fund investments. She is a Kauffman Fellow, Class 30. She builds both the frameworks that govern institutional private markets portfolios and the fund relationships that sustain them. She is one of the more directly relevant LPs in the room for any manager raising.", "title": "Senior Investment Officer", "company": "Bank of America"}, {"slug": "brendan-cosgrove-a3a0ba41", "photo": "photos/brendan-cosgrove-a3a0ba41.jpg", "name": "Brendan Cosgrove", "linkedin": "https://www.linkedin.com/in/brendan-cosgrove-a3a0ba41", "status": "Confirmed", "type": "Founder/Operator", "about": "Brendan Cosgrove is Co-Founder and Managing Director of Catalyze, the nonprofit platform behind this event that works to democratize access to capital for what it calls capital entrepreneurs, meaning emerging fund managers and allocators building new investment firms. Catalyze is a nonprofit, not a fund: it runs a fellowship and an annual cohort for emerging fund managers and allocators, and takes no economics in the funds it supports. Catalyze runs a fellowship program and an annual cohort, with the 2026 class including several people attending tonight. He is one of the hosts of this happy hour alongside Maegan Moorehart, Madeline Moerk, and Michael Belles. He is based in the greater Boston area. He is a useful first stop if you want an introduction to anyone else in the room.", "title": "Co-Founder & Managing Director", "company": "Catalyze"}, {"slug": "briandvo", "photo": "photos/briandvo.jpg", "name": "Brian Vo", "linkedin": "https://www.linkedin.com/in/briandvo", "status": "Guessed", "type": "VC", "about": "Brian Vo is CEO of Connect Humanity, a fund that finances community broadband and digital infrastructure for underserved communities, structured as an emerging CDFI using impact investing and blended finance. Connect Humanity is structured as an emerging CDFI using blended finance, combining philanthropic, public, and commercial capital to lend into community broadband operators that conventional infrastructure lenders will not underwrite. He has more than two decades in investment and strategy and has overseen over $7 billion in direct transactions across private equity and impact debt and equity. He was previously Vice President of Social Investment and Innovative Finance at Pact, a global development NGO, and a Director at Quantified Ventures designing outcomes-based transactions. He began his career as a consultant at McKinsey advising on economic development, growth strategy, and capital allocation. He holds an MBA and BS from Wharton and sits on the boards of Public Knowledge and if, A Foundation for Radical Possibility.", "title": "Chief Executive Officer", "company": "Connect Humanity"}, {"slug": "brittanytofinchio", "photo": "photos/brittanytofinchio.jpg", "name": "Brittany Palmer", "linkedin": "https://www.linkedin.com/in/brittanytofinchio", "status": "Confirmed", "type": "Other", "about": "Brittany Tofinchio Palmer is an investor and advisor backing startups focused on maximizing human independence and potential, based in the New York City metro area. She invests as an angel and advisor rather than through a named fund, so check size and stage are set deal by deal, and her public profile does not disclose either. She works across early-stage investing and advisory roles rather than at a single named platform on her public profile. Her stated focus on independence and human potential overlaps closely with Rich Palmer, who is also attending tonight and describes his focus in nearly identical terms. Outside of investing she lists travel and wildlife as personal passions. Ask her which vehicle she invests through, since her public profile does not name a fund. Because no vehicle is named and it is unclear whether she is backing companies or funds, she is filed under Other.", "title": "Investor & Advisor", "company": ""}, {"slug": "bryanlattimore", "photo": "photos/bryanlattimore.jpg", "name": "Bryan Lattimore", "linkedin": "https://www.linkedin.com/in/bryanlattimore", "status": "Guessed", "type": "VC", "about": "Bryan Lattimore is founding Television Ventures and describes his work as finding under-the-radar opportunities for others, spanning grants, fellowships, and investment. Television Ventures is newly founded and his stated model spans grants, fellowships, and equity rather than equity alone, and he has previously run an AngelList syndicate writing roughly $100,000 per deal. He is an alumnus of McKinsey & Company, the Chan Zuckerberg Initiative, and Emerson Collective, giving him an unusual mix of consulting, philanthropy, and mission-driven capital experience. He has previously founded Wynne and co-founded WITH, and has run an investment syndicate on AngelList with a typical check size around $100,000. His investor network includes James Currier of NFX, Charles Hudson of Precursor Ventures, and Andrew Beebe of Obvious Ventures. He is a good person to ask about non-dilutive and catalytic sources of capital.", "title": "Founder", "company": "Television Ventures"}, {"slug": "caitlinmorelli", "photo": "photos/caitlinmorelli.jpg", "name": "Caitlin Morelli", "linkedin": "https://www.linkedin.com/in/caitlinmorelli", "status": "Guessed", "type": "Other", "about": "Caitlin Morelli is Co-Founder of Worthmore and is based in Brooklyn, New York. Worthmore's model, stage, and capital source are not described publicly, which is why she is filed under Other rather than VC or LP. She holds a degree from Saïd Business School at the University of Oxford, the same program Catalyze CEO Maegan Moorehart attended. Her public profile is light on detail about Worthmore's current stage and focus, so the company is worth asking about directly. She is a first-degree connection, so you may already have context on her from a prior interaction. She invests with an impact lens, putting her alongside the other impact-oriented allocators in the room.", "title": "Co-Founder", "company": "Worthmore"}, {"slug": "caitlinstrandberg", "photo": "photos/caitlinstrandberg.jpg", "name": "Caitlin Str });

function saveState(slug) { localStorage.setItem('catalyze_' + slug, JSON.stringify(state[slug])); }

function cycleAction(slug) {
  const s = state[slug];
  if (!s.met && !s.not_relevant) { s.met = true; }
  else if (s.met) { s.met = false; s.not_relevant = true; }
  else { s.not_relevant = false; }
  saveState(slug); render();
}

function toggleExpand(slug) {
  state[slug].expanded = !state[slug].expanded;
  saveState(slug); render();
}

function saveNotes(slug) {
  const el = document.getElementById('notes_' + slug);
  if (el) { state[slug].notes = el.value; saveState(slug); }
}

function mkSvg(name) {
  const parts = name.trim().split(/\s+/);
  const ini = parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
  const palette = ['#2c4a38','#3d5c46','#1e4d30','#5a7a4a','#2a5038','#3a6b48','#1a3d28','#4a6040','#2e5540','#224030'];
  let h = 0; for (const c of name) h = (h*31+c.charCodeAt(0))|0;
  const col = palette[Math.abs(h)%palette.length];
  return "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' rx='40' fill='" + col + "'/><text x='40' y='52' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='600' fill='white'>" + ini + "</text></svg>";
}

const liSvg = (color) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="${color}"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`;

function liIcon(linkedin, status) {
  if (!linkedin) return `<span class="li-badge" style="opacity:.2">${liSvg('#9dbfaa')}</span>`;
  const color = status === 'Confirmed' ? '#0a66c2' : '#9dbfaa';
  return `<a href="${linkedin}" target="_blank" class="li-link li-badge" title="${status}">${liSvg(color)}</a>`;
}

function titleLevel(title) {
  if (!title) return 'junior';
  const t = title.toLowerCase();
  const senior = ['founder','co-founder','partner','director','vp','vice president','chief','president','head of','principal','managing','cto','ceo','coo','cfo','chair'];
  const junior = ['intern','analyst','coordinator','assistant','junior','associate analyst'];
  if (senior.some(s => t.includes(s))) return 'senior';
  if (junior.some(s => t.includes(s))) return 'junior';
  return 'mid';
}

function typePill(t) {
  const cls = {'VC':'vc','LP':'lp','Founder/Operator':'founder','Policy':'policy','NGO':'ngo','Academic/Research':'academic','Consultant/Advisor':'consultant','Other':'other','Unknown':'unknown'}[t]||'unknown';
  return `<span class="pill pill-${cls}">${t.replace(/\//g,'/ ')}</span>`;
}

function statusPill(s) {
  const cls = {'Confirmed':'confirmed','Guessed':'guessed','N/A':'na'}[s]||'na';
  return `<span class="pill pill-${cls}">${s||'N/A'}</span>`;
}

let sortCol = null, sortDir = 1;

function render() {
  const q  = document.getElementById('search').value.toLowerCase();
  const tf = document.getElementById('typeFilter').value;
  const sf = document.getElementById('statusFilter').value;
  const mf = document.getElementById('metFilter').value;

  let filtered = DATA.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !(a.about||'').toLowerCase().includes(q) && !(a.company||'').toLowerCase().includes(q)) return false;
    if (tf && a.type !== tf) return false;
    if (sf && a.status !== sf) return false;
    if (mf === 'met'  && !state[a.slug].met)          return false;
    if (mf === 'skip' && !state[a.slug].not_relevant) return false;
    return true;
  });

  if (sortCol) {
    filtered.sort((a,b) => {
      let av = a[sortCol]||'', bv = b[sortCol]||'';
      if (sortCol==='type') { av = TYPE_ORDER[av]??9; bv = TYPE_ORDER[bv]??9; return (av-bv)*sortDir; }
      return av.localeCompare(bv)*sortDir;
    });
  } else {
    filtered.sort((a,b) => (TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9) || a.name.localeCompare(b.name));
  }

  document.getElementById('countLabel').textContent = `${filtered.length} of ${DATA.length}`;

  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No attendees match your filters.</td></tr>`;
    document.getElementById('batchBtns').innerHTML = '';
    return;
  }

  tbody.innerHTML = filtered.map(a => {
    const photoSrc = a.photo || mkSvg(a.name);
    const s = state[a.slug];
    const rowCls    = s.not_relevant ? 'not-relevant-row' : '';
    const actionCls = s.met ? 'state-met' : s.not_relevant ? 'state-skip' : '';
    const actionLbl = s.met ? '✓' : s.not_relevant ? '✗' : '';
    const hasAbout  = !!a.about;

    let aboutContent;
    if (s.expanded) {
      aboutContent = `
        <div class="about-full">${hasAbout ? a.about.replace(/\n\n/g,'<br><br>') : '<span style="color:#b0bdb3">—</span>'}</div>
        <div class="notes-wrap">
          <div class="notes-label">Notes</div>
          <textarea class="notes-input" id="notes_${a.slug}" placeholder="Add a note…"
            oninput="saveNotes('${a.slug}')"
            onclick="event.stopPropagation()">${s.notes||''}</textarea>
        </div>`;
    } else {
      const longEnough = hasAbout && a.about.length > 180;
      aboutContent = `
        <div class="about-snippet">${hasAbout ? a.about : '<span style="color:#b0bdb3">—</span>'}</div>
        ${longEnough ? `<span class="expand-hint">↓ more</span>` : ''}`;
    }

    return `<tr class="main-row ${rowCls}">
      <td class="action-cell">
        <button class="action-btn ${actionCls}" onclick="cycleAction('${a.slug}')" title="Cycle: unset → met → skip">${actionLbl}</button>
      </td>
      <td class="identity-cell">
        <div class="identity-inner">
          <img class="photo" src="${photoSrc}" alt="${a.name}" onerror="this.src='${mkSvg(a.name)}'">
          <div class="identity-text">
            <div class="name-line">
              ${liIcon(a.linkedin, a.status)}
              <span class="person-name">${a.name}</span>
            </div>
            ${a.company ? `<div class="company-line">${a.company}</div>` : ''}
            ${a.title ? `<div class="title-line title-${titleLevel(a.title)}">${a.title}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="type-cell">${typePill(a.type)}</td>
      <td class="about-cell" onclick="toggleExpand('${a.slug}')">
        ${aboutContent}
      </td>
      <td class="status-cell">${statusPill(a.status)}</td>
    </tr>`;
  }).join('');

  const batchBtns = document.getElementById('batchBtns');
  const liUrls = filtered.filter(a => a.linkedin).map(a => a.linkedin);
  batchBtns.innerHTML = '';
  for (let i = 0; i < liUrls.length; i += 10) {
    const batch = liUrls.slice(i, i+10);
    const btn = document.createElement('button');
    btn.className = 'batch-btn';
    btn.textContent = `Open LinkedIn ${i+1}\u2013${Math.min(i+10, liUrls.length)}`;
    btn.onclick = (function(urls) {
      return function() {
        const script = urls.map(u => `window.open(${JSON.stringify(u)},'_blank');`).join('');
        const page = `<html><body><script>window.onload=function(){${script}window.close();}<\/script><p style="font-family:sans-serif;padding:20px">Opening ${urls.length} tabs\u2026</p></body></html>`;
        window.open(URL.createObjectURL(new Blob([page],{type:'text/html'})),'_blank');
      };
    })(batch);
    batchBtns.appendChild(btn);
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('metFilter').addEventListener('change', render);

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  });
});

render();
</script>
</body>
</html>
