<head>

<title>Catalyze NYC Happy Hour · Aug 2026</title>
<style>
  :root {
    --forest:  #2c4a38;
    --brand:   #3d7a55;
    --bg:      #f3f2ec;
    --card:    #ffffff;

    --text:    #1a2820;
    --muted:   #5c6e60;
    --met:     #2c6644;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  header {

    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  header p  { font-size: 12px; color: #9dbfaa; margin-top: 4px; }
  .luma-link {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
    padding: 5px 11px; border-radius: 5px; border: 1px solid rgba(157,191,170,.4);
    font-size: 11px; font-weight: 500; color: #c8dfd0; text-decoration: none;
    transition: background .12s;
  }
  .luma-link:hover { background: rgba(255,255,255,.08); color: #e8f0eb; }
  .toolbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 36px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    box-shadow: 0 1px 3px rgba(44,74,56,.04);
  }
  .toolbar input, .toolbar select {
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px;
    font-size: 13px; color: var(--text); background: var(--bg); outline: none;
    font-family: inherit;
  }
  .toolbar input { width: 210px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--brand); }
  .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
  .batch-btns { padding: 12px 36px; display: flex; gap: 8px; flex-wrap: wrap; }
  .batch-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 5px;
    padding: 7px 14px; font-size: 12px; color: var(--muted); cursor: pointer;
    font-family: inherit; transition: all .12s;
  }
  .batch-btn:hover { border-color: var(--brand); color: var(--brand); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--card); text-align: left; padding: 10px 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); border-bottom: 2px solid var(--border); cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { margin-left: 4px; opacity: .35; }
  thead th.sorted .sort-arrow { opacity: 1; color: var(--brand); }
  thead th.no-sort { cursor: default; }
  thead th.no-sort:hover { color: var(--muted); }
  tbody tr { border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr.main-row:hover { background: #eef1ed; }
  tbody tr.not-relevant-row { opacity: 0.35; }
  td { padding: 12px 14px; }
  .action-cell { width: 48px; text-align: center; padding: 12px 6px; vertical-align: middle; }
  .action-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer; font-size: 14px; display: inline-flex;
    align-items: center; justify-content: center; transition: all .15s;
    color: #b0bdb3; font-weight: 700;
  }
  .action-btn:hover { border-color: var(--muted); color: var(--muted); }
  .action-btn.state-met  { background: var(--met);  border-color: var(--met);  color: #fff; }
  .action-btn.state-skip { background: var(--skip); border-color: var(--skip); color: #fff; }
  .identity-cell { width: 210px; min-width: 180px; white-space: nowrap; vertical-align: middle; }
  .identity-inner { display: flex; align-items: flex-start; gap: 10px; }
  .photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    background: #dde5db; display: block; flex-shrink: 0; margin-top: 2px; }
  .identity-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name-line { display: flex; align-items: center; gap: 5px; }
  .person-name { font-weight: 600; font-size: 13.5px; line-height: 1.25; color: var(--text); white-space: nowrap; }
  .company-line { font-size: 13px; color: var(--brand); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .title-line { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .title-senior { color: #b83030; }
  .title-mid    { color: #c07020; }
  .title-junior { color: var(--muted); }
  .li-badge { display: inline-flex; align-items: center; flex-shrink: 0; }
  .li-badge svg { display: block; }
  .li-link { text-decoration: none; }
  .type-cell   { width: 62px; min-width: 58px; vertical-align: middle; text-align: center; }
  .status-cell { width: 88px; min-width: 78px; vertical-align: middle; text-align: center; }
  .about-cell {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    cursor: pointer; padding-right: 20px;
  }
  .about-cell:hover .about-snippet { color: var(--text); }
  .about-snippet {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color .12s;
  }
  .expand-hint {
    display: inline-block; margin-top: 4px; font-size: 11px;
    color: var(--brand); letter-spacing: .01em;
  }
  .about-full { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .notes-wrap { margin-top: 12px; }
  .notes-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  .notes-input {
    width: 100%; min-height: 52px; resize: vertical;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg);
    outline: none; line-height: 1.5; transition: border-color .12s;
  }
  .notes-input:focus { border-color: var(--brand); background: var(--card); }
  .notes-input::placeholder { color: #b0bdb3; }
  .pill {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .01em;
    white-space: normal; text-align: center; line-height: 1.3;
  }
  .pill-vc         { background: #cce5d6; color: #1a4d2e; }
  .pill-lp         { background: #d0e8de; color: #1e5235; }
  .pill-impact     { background: #d6edd8; color: #1e5535; }
  .pill-investor   { background: #d8ead8; color: #1a4a2a; }
  .pill-founder    { background: #f5e6c8; color: #7a4a10; }
  .pill-policy     { background: #d0e8e4; color: #0f4040; }
  .pill-consultant { background: #e6dff0; color: #4a2a70; }
  .pill-academic   { background: #f0dde8; color: #6a1a40; }
  .pill-unknown    { background: #e8e8e2; color: #5a5a52; }
  .pill-confirmed  { background: #d1fae5; color: #065f46; }
  .pill-guessed    { background: #fef9c3; color: #854d0e; }
  .pill-na         { background: #f3f4f6; color: #6b7280; }
  .empty-state { text-align: center; padding: 56px 32px; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) {
    header, .toolbar, .batch-btns { padding-left: 16px; padding-right: 16px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input, .toolbar select { width: 100%; }
    .count { margin-left: 0; }
  }
</style>

he University of Pennsylvania and studied at the London School of Economics, and is based in New York.", "title": "Managing Director, Head of Impact Engagement", "company": "Sonen Capital"}, {"slug": "amberillig", "photo": "", "name": "Amber Illig", "linkedin": "https://www.linkedin.com/in/amberillig", "status": "Confirmed", "type": "VC", "about": "Amber Illig is General Partner at The Council, an early-stage venture fund she runs out of San Francisco. She spent the first half of her career on factory floors at Sanmina, Flextronics, Foxconn, Pegatron, and Jabil Nypro while working for Eli Lilly, Apple, Snap, and Delta Faucet, then moved to Cruise, where many former colleagues are now her LPs or portfolio founders. She runs SPVs selectively alongside the core fund when there is a strong follow-on or co-invest opportunity, and shares carry with team members who work on ops and diligence. Recent portfolio activity includes Rosarium Health. She is a member of the Catalyze 2026 cohort and studied at Purdue University.", "title": "General Partner", "company": "The Council"}, {"slug": "andrew-brown-6145a454", "photo": "", "name": "Andrew Brown", "linkedin": "https://www.linkedin.com/in/andrew-brown-6145a454", "status": "Confirmed", "type": "Consultant/Advisor", "about": "Andrew Brown provides outsourced CFO services and back-office support to venture capital funds through Nakama Venture Solutions. He has fifteen years in venture fund administration and has worked with well over 1,000 funds across sizes, strategies, and structures. He co-founded Carta's fund administration team and also founded Carta's pre-close team, which specialized in fund formation and one-on-one consultation for emerging fund managers. His specialty is applying institutional-grade practices and procedures at scale to funds of any size. He studied at Rider University and is based in Langhorne, Pennsylvania.", "title": "CFO for Venture Capitalists", "company": "Nakama Venture Solutions"}, {"slug": "ashlietyler", "photo": "", "name": "Ashlie Tyler", "linkedin": "https://www.linkedin.com/in/ashlietyler", "status": "Confirmed", "type": "LP", "about": "Ashlie Tyler is a senior investment officer at Bank of America, where she has helped design and scale the firm's roughly $550 million private markets investment platform since 2020. Her work spans the full investment lifecycle: sourcing and underwriting fund commitments, leading diligence, constructing and pacing a diversified portfolio across strategies and vintages, and managing GP relationships and investment committee processes across more than 150 fund investments. She is a Kauffman Fellow, Class 30. She builds both the frameworks that govern institutional private markets portfolios and the fund relationships that sustain them. She is one of the more directly relevant LPs in the room for any manager raising.", "title": "Senior Investment Officer", "company": "Bank of America"}, {"slug": "brendan-cosgrove-a3a0ba41", "photo": "", "name": "Brendan Cosgrove", "linkedin": "https://www.linkedin.com/in/brendan-cosgrove-a3a0ba41", "status": "Confirmed", "type": "Founder/Operator", "about": "Brendan Cosgrove is Co-Founder and Managing Director of Catalyze, the nonprofit platform behind this event that works to democratize access to capital for what it calls capital entrepreneurs, meaning emerging fund managers and allocators building new investment firms. Catalyze runs a fellowship program and an annual cohort, with the 2026 class including several people attending tonight. He is one of the hosts of this happy hour alongside Maegan Moorehart, Madeline Moerk, and Michael Belles. He is based in the greater Boston area. He is a useful first stop if you want an introduction to anyone else in the room.", "title": "Co-Founder & Managing Director", "company": "Catalyze"}, {"slug": "briandvo", "photo": "", "name": "Brian Vo", "linkedin": "https://www.linkedin.com/in/briandvo", "status": "Guessed", "type": "Impact Investor", "about": "Brian Vo is CEO of Connect Humanity, a fund that finances community broadband and digital infrastructure for underserved communities, structured as an emerging CDFI using impact investing and blended finance. He has more than two decades in investment and strategy and has overseen over $7 billion in direct transactions across private equity and impact debt and equity. He was previously Vice President of Social Investment and Innovative Finance at Pact, a global development NGO, and a Director at Quantified Ventures designing outcomes-based transactions. He began his career as a consultant at McKinsey advising on economic development, growth strategy, and capital allocation. He holds an MBA and BS from Wharton and sits on the boards of Public Knowledge and if, A Foundation for Radical Possibility.", "title": "Chief Executive Officer", "company": "Connect Humanity"}, {"slug": "brittanytofinchio", "photo": "", "name": "Brittany Palmer", "linkedin": "https://www.linkedin.com/in/brittanytofinchio", "status": "Confirmed", "type": "Investor", "about": "Brittany Tofinchio Palmer is an investor and advisor backing startups focused on maximizing human independence and potential, based in the New York City metro area. She works across early-stage investing and advisory roles rather than at a single named platform on her public profile. Her stated focus on independence and human potential overlaps closely with Rich Palmer, who is also attending tonight and describes his focus in nearly identical terms. Outside of investing she lists travel and wildlife as personal passions. Ask her which vehicle she invests through, since her public profile does not name a fund.", "title": "Investor & Advisor", "company": ""}, {"slug": "bryanlattimore", "photo": "", "name": "Bryan Lattimore", "linkedin": "https://www.linkedin.com/in/bryanlattimore", "status": "Guessed", "type": "Investor", "about": "Bryan Lattimore is founding Television Ventures and describes his work as finding under-the-radar opportunities for others, spanning grants, fellowships, and investment. He is an alumnus of McKinsey & Company, the Chan Zuckerberg Initiative, and Emerson Collective, giving him an unusual mix of consulting, philanthropy, and mission-driven capital experience. He has previously founded Wynne and co-founded WITH, and has run an investment syndicate on AngelList with a typical check size around $100,000. His investor network includes James Currier of NFX, Charles Hudson of Precursor Ventures, and Andrew Beebe of Obvious Ventures. He is a good person to ask about non-dilutive and catalytic sources of capital.", "title": "Founder", "company": "Television Ventures"}, {"slug": "caitlinmorelli", "photo": "", "name": "Caitlin Morelli", "linkedin": "https://www.linkedin.com/in/caitlinmorelli", "status": "Guessed", "type": "Founder/Operator", "about": "Caitlin Morelli is Co-Founder of Worthmore and is based in Brooklyn, New York. She holds a degree from Saïd Business School at the University of Oxford, the same program Catalyze CEO Maegan Moorehart attended. Her public profile is light on detail about Worthmore's current stage and focus, so the company is worth asking about directly. She is a first-degree connection, so you may already have context on her from a prior interaction. Among a room heavy on fund managers and allocators, she is one of the operator-side attendees.", "title": "Co-Founder", "company": "Worthmore"}, {"slug": "caitlinstrandberg", "photo": "", "name": "Caitlin Strandberg", "linkedin": "https://www.linkedin.com/in/caitlinstrandberg", "status": "Confirmed", "type": "VC", "about": "Caitlin Strandberg is Founder and Managing Partner of Spring Ventures, an early-stage venture firm she launched and runs from New York. She was previously an investor at Lerer Hippeau, one of New York's most active seed funds, and has spent her career on the operating and investing sides of early-stage consumer and marketplace companies. She holds an MBA from Harvard Business School. As a solo GP who has raised her own vehicle, she is squarely in the capital entrepreneur category Catalyze convenes. She is a useful person to compare notes with on fund formation and LP fundraising in New York.", "title": "Founder & Managing Partner", "company": "Spring Ventures"}, {"slug": "chadconway", "photo": "", "name": "Chad Conway", "linkedin": "https://www.linkedin.com/in/chadconway", "status": "Confirmed", "type": "VC", "about": "Chad Conway invests through New Fund and describes his thesis simply as backing visionary products that change the world. He appears in the Catalyze 2026 cohort announcement alongside Amber Illig, Brian Vo, and Judy Li, several of whom are also attending tonight. He has a following of roughly 8,000 on LinkedIn and posts regularly on early-stage investing. His public profile is deliberately spare on firm detail, so the fund's stage, check size, and sector focus are worth asking about in person. He is based in the United States.", "title": "Investor", "company": "New Fund"}, {"slug": "chad-mullin", "photo": "", "name": "Chad Mullin", "linkedin": "", "status": "N/A", "type": "Unknown", "about": "No LinkedIn profile could be matched to this attendee with enough confidence to list. Several people share the name, and none of the public results connect to venture, fund administration, or allocation. Given the Catalyze audience he is most likely an emerging manager or a service provider to funds. Worth asking directly which firm he is with so the record can be completed later. Nothing is listed here rather than risk linking the wrong person.", "title": "", "company": ""}, {"slug": "charliestephens", "photo": "", "name": "Charlie Stephens", "linkedin": "https://www.linkedin.com/in/charliestephens", "status": "Confirmed", "type": "Consultant/Advisor", "about": "Charlie Stephens works on the venture capital and startup ecosystem team at Fidelity Investments in New York. Fidelity has built out a significant private markets services business serving venture funds, including fund administration and Fidelity Private Shares for cap table and equity management. He is one of four Fidelity people attending tonight, alongside Chirant Parmar, Olivia Sutcliffe, and Julia Miklasevich, which suggests Fidelity is showing up in force at this event. He studied at Ithaca College. He is a natural contact if you want to understand what Fidelity is offering emerging managers.", "title": "VC & Startup Ecosystem", "company": "Fidelity Investments"}, {"slug": "chirant-parmar-1798b150", "photo": "", "name": "Chirant Parmar", "linkedin": "https://www.linkedin.com/in/chirant-parmar-1798b150", "status": "Guessed", "type": "Consultant/Advisor", "about": "Chirant Parmar works in venture capital fund administration at Fidelity Investments and is based in the New York City metro area. He previously served as Controller at VMS Group, progressing from staff accountant to controller with responsibility for financial management and regulatory compliance across fund entities. Before his finance career he served as a Lieutenant in the United States Navy, overseeing ship scheduling and mission area certification requirements. He studied at Rutgers Business School. He is one of several fund administration and back-office specialists in the room tonight, a group that includes Andrew Brown, Elwyn Fernandes, and Olivia Sutcliffe.", "title": "VC Fund Administration", "company": "Fidelity Investments"}, {"slug": "conike", "photo": "", "name": "Chuk Onike", "linkedin": "https://www.linkedin.com/in/conike", "status": "Guessed", "type": "Policy/NGO", "about": "Chukwudi Onike works on strategic partnerships and global philanthropy at eBay with a focus on inclusive entrepreneurship, and is based in Atlanta. He was previously a Program Officer at Visa Foundation, where he deployed corporate philanthropic and impact capital to small business and inclusive growth initiatives. His work sits on the funder side of the ecosystem, deploying corporate and foundation capital rather than institutional LP money. He has mentored students at the Colin Powell School, including through the S Jay Levy Fellowship. He is a relevant contact for anyone whose fund or company touches small business access to capital.", "title": "Strategic Partnerships & Global Philanthropy", "company": "eBay"}, {"slug": "constancebowen", "photo": "", "name": "Connie Bowen", "linkedin": "https://www.linkedin.com/in/constancebowen", "status": "Confirmed", "type": "VC", "about": "Connie Bowen is Founding General Partner of Farmhand Ventures, an early-stage fund backing companies building tools for the people who grow food and manage land, based in St. Louis. She previously led The Yield Lab Institute and has spent her career at the intersection of agriculture, food systems, and technology. As a founding GP she is raising and running her own vehicle, which puts her at the center of the Catalyze capital entrepreneur community. Farmhand's thesis focuses on the practitioner rather than the enterprise buyer, which is an unusual framing in agtech. She is a first-degree connection.", "title": "Founding General Partner", "company": "Farmhand Ventures"}, {"slug": "eduardozaldivar", "photo": "", "name": "Eduardo Zaldivar", "linkedin": "https://www.linkedin.com/in/eduardozaldivar", "status": "Confirmed", "type": "Investor", "about": "Eduardo Zaldivar is an emerging fund manager and search fund investor running Mosaic ETA, a vehicle focused on entrepreneurship through acquisition rather than traditional venture. Search funds raise capital to acquire and operate an existing small or mid-sized business, a strategy distinct from most of the venture managers in the room tonight. He holds an MBA from Stanford Graduate School of Business and an MPA from Harvard. He is based in Dallas, Texas. He is a useful person to talk to if you want a view on how ETA and small-business acquisition capital compare to venture on returns and LP appetite.", "title": "Emerging F y went by Movafaghi. She is one of four Fidelity people attending tonight, alongside Charlie Stephens, Chirant Parmar, and Julia Miklasevich. Fidelity is clearly targeting the emerging manager segment through this community.", "title": "VC Fund Administration", "company": "Fidelity Investments"}, {"slug": "rachel-brissette", "photo": "", "name": "Rachel Brissette", "linkedin": "https://www.linkedin.com/in/rachel-brissette", "status": "Guessed", "type": "Consultant/Advisor", "about": "Rachel Brissette runs growth marketing at Sydecar, the platform that automates SPV and fund formation, banking, and back-office operations for emerging managers and syndicate leads. She previously held growth marketing roles at Grata, the private company search platform, and at PURE Group of Insurance Companies. She studied at Williams College and is based in New York. She is attending alongside Jake Don Sing, who handles venture sales at Sydecar. Sydecar is a common first vehicle for managers running deals before raising a committed fund.", "title": "Growth Marketing", "company": "Sydecar"}, {"slug": "racheltsui", "photo": "", "name": "Rachel Tsui", "linkedin": "https://www.linkedin.com/in/racheltsui", "status": "Confirmed", "type": "VC", "about": "Rachel Tsui is a Partner at The Council, focused on healthcare, life sciences, and customer success, and is based in San Francisco. She works alongside Amber Illig, The Council's General Partner, who is also attending tonight. Illig recently thanked her publicly for work on two SPVs, which suggests Tsui is closely involved in the fund's diligence and deal execution. Her healthcare and life sciences focus overlaps with Julian Eison, Jeff Chu, and the Arcventis and HealthBridge team also in the room. Between her and Illig, The Council is well represented at this event.", "title": "Partner", "company": "The Council"}, {"slug": "mrandallstrickland", "photo": "", "name": "Randy Strickland", "linkedin": "https://www.linkedin.com/in/mrandallstrickl rds in the room. He is best known publicly for authoring an annual survey on the demographic composition of the venture capital industry, which has become a widely cited reference on diversity among decision-makers at funds. He studied at Georgetown University. He is one of the more established investors attending an event otherwise weighted toward first-time and emerging managers.", "title": "Partner", "company": "Field Ventures"}, {"slug": "richard-pines-08ba171", "photo": "", "name": "Richard Pines", "linkedin": "https://www.linkedin.com/in/richard-pines-08ba171", "status": "Guessed", "type": "VC", "about": "Richard Pines is Co-Founder and Managing Partner of Arcventis Health Partners in New York, a healthcare-focused growth equity firm he launched with Fazeela Abdul Rashid, who is also attending tonight. In 2008 he was a founding partner of Athyrium Capital Management, which grew to roughly $3.7 billion in assets focused on structured investments in global healthcare. His earlier career included Structured Alpha Solutions, Glassbeam, and Lehman Brothers, and he has served on the Glassbeam board. He studied at Indiana University Bloomington. Between him and Abdul Rashid, this is a pair of experienced healthcare investors launching a new firm, which puts them in the emerging manager category despite very senior backgrounds.", "title": "Co-Founder & Managing Partner", "company": "Arcventis Health Partners"}, {"slug": "therichpalmer", "photo": "", "name": "Rich Palmer", "linkedin": "https://www.linkedin.com/in/therichpalmer", "status": "Confirmed", "type": "Investor", "about": "Rich Palmer is an investor based in the New York City metro area focused on maximizing human independence, potential, and dignity. He is the co-founder of Gravyty, an artificial intelligence company serving nonprofit fundraising that was acquired, giving him an exit as an operator before moving to the investing side. He studied at the Franklin W. Olin Graduate School of Business at Babson College. His stated focus is nearly identical to Brittany Tofinchio Palmer's, who is also attending tonight. His public profile does not name a current fund, so the vehicle is worth asking about.", "title": "Investor", "company": ""}, {"slug": "rubybolaria2", "photo": "", "name": "Ruby Bolaria Shifrin", "linkedin": "https://www.linkedin.com/in/rubybolaria2", "status": "Confirmed", "type": "Impact Investor", "about": "Ruby Bolaria Shifrin is Chief Investment and Partnerships Officer at Terner Labs, the applied innovation arm connected to the Terner Center for Housing Innovation at Berkeley, working on capital solutions for equitable housing and community development. She was previously Director of Housing Affordability at the Chan Zuckerberg Initiative, where she deployed philanthropic and impact capital into housing. She explicitly identifies as a next generation fund manager, placing her among the emerging managers this event convenes. She is based in the San Francisco Bay Area and is a first-degree connection. Her housing and community development focus is one of the closest thematic overlaps with Streetlife's work on cities.", "title": "Chief Investment & Partnerships Officer", "company": "Terner Labs"}, {"slug": "samaramejia", "photo": "", "name": "Samara Mejia Hernandez", "linkedin": "https://www.linkedin.com/in/samaramejia", "status": "Confirmed", "type": "VC", "about": "Samara Mejia Hernandez is Founding Partner of Chingona Ventures, a Chicago-based pre-seed fund investing in fast-growing markets that are underserved by traditional venture, with a focus on founders from non-obvious backgrounds. She was previously at MATH Venture Partners and spent years in corporate finance at Merrill Lynch before moving into venture. She holds an MBA from the Kellogg School of Management at Northwestern. She raised and runs her own fund, making her one of the more established capital entrepreneurs in the room. She is based in the greater Chicago area.", "title": "Founding Partner", "company": "Chingona Ventures"}, {"slug": "sayiddah-m", "photo": "", "name": "Sayiddah McCree", "linkedin": "https://www.linkedin.com/in/sayiddah-m", "status": "Guessed", "type": "LP", "about": "Sayiddah McCree is an investor working on impact and mission-aligned initiatives at a private foundation, and was previously Senior Impact Investment Officer at the John D. and Catherine T. MacArthur Foundation. Before that she worked at J.P. Morgan and the Ford Foundation, advancing impact and financial returns through investments in private equity funds, which is directly the LP function. She is a Kauffman Fellow in Class 30, the same cohort as Ashlie Tyler, who is also attending tonight. She holds an MBA from Harvard Business School and a Bachelor of Architecture from the Illinois Institute of Technology, and started her career as a building facade consultant before moving to real estate investing at Related Companies. She is Board Co-President of the International Contemporary Ensemble, is also a visual artist, and is a first-degree connection.", "title": "Investor", "company": "Private Foundation"}, {"slug": "shane-goudey-217a482", "photo": "", "name": "Shane Goudey", "linkedin": "https://www.linkedin.com/in/shane-goudey-217a482", "status": "Confirmed", "type": "Consultant/Advisor", "about": "Shane Goudey is a Partner at Sidley Austin and Chair of the firm's Venture Funds Practice, based in Palo Alto. He advises fund sponsors on formation, structuring, and LP negotiations, which is the legal counterpart to what the fund administrators in this room handle operationally. Sidley is one of the leading firms for venture fund formation, so he sees a very wide cross-section of terms across emerging and established managers. He holds a JD from New York University School of Law. He is one of the most senior service-side people attending and a useful contact on current LPA terms and market standards.", "title": "Partner & Chair, Venture Funds Practice", "company": "Sidley Austin LLP"}, {"slug": "shrutishah1", "photo": "", "name": "Shruti Shah", "linkedin": "https://www.linkedin.com/in/shrutishah1", "status": "Confirmed", "type": "VC", "about": "Shruti Shah is a General Partner at Symphonic Capital, an early-stage fund investing in artificial intelligence infrastructure across fintech, healthcare, and climate. She co-founded the firm with Sydney Thomas, who is also attending tonight, making them one of two attending pairs from the same emerging fund. She is based in Durham, North Carolina. As a co-founding GP raising and deploying her own vehicle she sits at the center of the Catalyze capital entrepreneur community. She is a first-degree connection.", "title": "General Partner", "company": "Symphonic Capital"}, {"slug": "stephanie-smith", "photo": "", "name": "Stephanie Smith", "linkedin": "", "status": "N/A", "type": "Unknown", "about": "No LinkedIn profile could be confirmed for this attendee. The name is common enough that public search returned no candidate specific enough to link without risking a wrong match. Given the Catalyze audience she is most likely an emerging manager, allocator, or ecosystem partner. Worth asking in person which firm she is with so the record can be completed. Nothing is linked here deliberately.", "title": "", "company": ""}, {"slug": "sydney-p-thomas", "photo": "", "name": "Sydney Thomas", "linkedin": "https://www.linkedin.com/in/sydney-p-thomas", "status": "Confirmed", "type": "VC", "about": "Sydney Paige Thomas is the founder of Symphonic Capital, where her title is Conductor, an early-stage fund investing in artificial intelligence infrastructure across fintech, healthcare, and climate. She was previously a Principal at Precursor Ventures, one of the most active pre-seed funds in the United States, where she built a strong reputation for founder-first investing. She writes a widely read newsletter and is a visible public voice on venture and access to capital. She co-founded Symphonic with Shruti Shah, who is also attending tonight. She is based in San Diego and is a first-degree connection.", "title": "Founder & General Partner", "company": "Symphonic Capital"}, {"slug": "vidya-raman", "photo": "", "name": "Vidya Raman", "linkedin": "https://www.linkedin.com/in/vidya-raman", "status": "Confirmed", "type": "VC", "about": "Vidya Raman is Managing Partner of FirstByte Ventures, an early-stage fund she launched, based in the San Francisco Bay Area. She was previously a Partner at Sorenson Ventures investing in enterprise software and security, and before that spent years as an operator in engineering and product roles, giving her a technical background alongside her investing track record. She has publicly credited Catalyze and Madeline Moerk in connection with her fund building work. She has a following of roughly seven thousand on LinkedIn. As a managing partner of a newly launched firm she is squarely in the emerging manager group this event convenes.", "title": "Managing Partner", "company": "FirstByte Ventures"}];
const TYPE_ORDER = {'VC':0,'LP':1,'Impact Investor':2,'Investor':3,'Founder/Operator':4,'Policy/NGO':5,'Consultant/Advisor':6,'Academic/Research':7,'Unknown':8};

const state = {};
DATA.forEach(a => {
  const stored = JSON.parse(localStorage.getItem('catalyze_' + a.slug) || 'null');
  state[a.slug] = stored || { met: false, not_relevant: false, expanded: false, notes: '' };
  if (!('notes'    in state[a.slug])) state[a.slug].notes    = '';
  if (!('expanded' in state[a.slug])) state[a.slug].expanded = false;
});

function saveState(slug) { localStorage.setItem('catalyze_' + slug, JSON.stringify(state[slug])); }

function cycleAction(slug) {
  const s = state[slug];
  if (!s.met && !s.not_relevant) { s.met = true; }
  else if (s.met) { s.met = false; s.not_relevant = true; }
  else { s.not_relevant = false; }
  saveState(slug); render();
}

function toggleExpand(slug) {
  state[slug].expanded = !state[slug].expanded;
  saveState(slug); render();
}

function saveNotes(slug) {
  const el = document.getElementById('notes_' + slug);
  if (el) { state[slug].notes = el.value; saveState(slug); }
}

function mkSvg(name) {
  const parts = name.trim().split(/\s+/);
  const ini = parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
  const palette = ['#2c4a38','#3d5c46','#1e4d30','#5a7a4a','#2a5038','#3a6b48','#1a3d28','#4a6040','#2e5540','#224030'];
  let h = 0; for (const c of name) h = (h*31+c.charCodeAt(0))|0;
  const col = palette[Math.abs(h)%palette.length];
  return "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' rx='40' fill='" + col + "'/><text x='40' y='52' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='600' fill='white'>" + ini + "</text></svg>";
}

const liSvg = (color) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="${color}"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`;

function liIcon(linkedin, status) {
  if (!linkedin) return `<span class="li-badge" style="opacity:.2">${liSvg('#9dbfaa')}</span>`;
  const color = status === 'Confirmed' ? '#0a66c2' : '#9dbfaa';
  return `<a href="${linkedin}" target="_blank" class="li-link li-badge" title="${status}">${liSvg(color)}</a>`;
}

function titleLevel(title) {
  if (!title) return 'junior';
  const t = title.toLowerCase();
  const senior = ['founder','co-founder','partner','director','vp','vice president','chief','president','head of','principal','managing','cto','ceo','coo','cfo','chair'];
  const junior = ['intern','analyst','coordinator','assistant','junior','associate analyst'];
  if (senior.some(s => t.includes(s))) return 'senior';
  if (junior.some(s => t.includes(s))) return 'junior';
  return 'mid';
}

function typePill(t) {
  const cls = {'VC':'vc','LP':'lp','Impact Investor':'impact','Investor':'investor','Founder/Operator':'founder','Policy/NGO':'policy','Consultant/Advisor':'consultant','Academic/Research':'academic','Unknown':'unknown'}[t]||'unknown';
  return `<span class="pill pill-${cls}">${t.replace(/\//g,'/ ')}</span>`;
}

function statusPill(s) {
  const cls = {'Confirmed':'confirmed','Guessed':'guessed','N/A':'na'}[s]||'na';
  return `<span class="pill pill-${cls}">${s||'N/A'}</span>`;
}

let sortCol = null, sortDir = 1;

function render() {
  const q  = document.getElementById('search').value.toLowerCase();
  const tf = document.getElementById('typeFilter').value;
  const sf = document.getElementById('statusFilter').value;
  const mf = document.getElementById('metFilter').value;

  let filtered = DATA.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !(a.about||'').toLowerCase().includes(q) && !(a.company||'').toLowerCase().includes(q)) return false;
    if (tf && a.type !== tf) return false;
    if (sf && a.status !== sf) return false;
    if (mf === 'met'  && !state[a.slug].met)          return false;
    if (mf === 'skip' && !state[a.slug].not_relevant) return false;
    return true;
  });

  if (sortCol) {
    filtered.sort((a,b) => {
      let av = a[sortCol]||'', bv = b[sortCol]||'';
      if (sortCol==='type') { av = TYPE_ORDER[av]??9; bv = TYPE_ORDER[bv]??9; return (av-bv)*sortDir; }
      return av.localeCompare(bv)*sortDir;
    });
  } else {
    filtered.sort((a,b) => (TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9) || a.name.localeCompare(b.name));
  }

  document.getElementById('countLabel').textContent = `${filtered.length} of ${DATA.length}`;

  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No attendees match your filters.</td></tr>`;
    document.getElementById('batchBtns').innerHTML = '';
    return;
  }

  tbody.innerHTML = filtered.map(a => {
    const photoSrc = a.photo || mkSvg(a.name);
    const s = state[a.slug];
    const rowCls    = s.not_relevant ? 'not-relevant-row' : '';
    const actionCls = s.met ? 'state-met' : s.not_relevant ? 'state-skip' : '';
    const actionLbl = s.met ? '✓' : s.not_relevant ? '✗' : '';
    const hasAbout  = !!a.about;

    let aboutContent;
    if (s.expanded) {
      aboutContent = `
        <div class="about-full">${hasAbout ? a.about.replace(/\n\n/g,'<br><br>') : '<span style="color:#b0bdb3">—</span>'}</div>
        <div class="notes-wrap">
          <div class="notes-label">Notes</div>
          <textarea class="notes-input" id="notes_${a.slug}" placeholder="Add a note…"
            oninput="saveNotes('${a.slug}')"
            onclick="event.stopPropagation()">${s.notes||''}</textarea>
        </div>`;
    } else {
      const longEnough = hasAbout && a.about.length > 180;
      aboutContent = `
        <div class="about-snippet">${hasAbout ? a.about : '<span style="color:#b0bdb3">—</span>'}</div>
        ${longEnough ? `<span class="expand-hint">↓ more</span>` : ''}`;
    }

    return `<tr class="main-row ${rowCls}">
      <td class="action-cell">
        <button class="action-btn ${actionCls}" onclick="cycleAction('${a.slug}')" title="Cycle: unset → met → skip">${actionLbl}</button>
      </td>
      <td class="identity-cell">
        <div class="identity-inner">
          <img class="photo" src="${photoSrc}" alt="${a.name}" onerror="this.src='${mkSvg(a.name)}'">
          <div class="identity-text">
            <div class="name-line">
              ${liIcon(a.linkedin, a.status)}
              <span class="person-name">${a.name}</span>
            </div>
            ${a.company ? `<div class="company-line">${a.company}</div>` : ''}
            ${a.title ? `<div class="title-line title-${titleLevel(a.title)}">${a.title}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="type-cell">${typePill(a.type)}</td>
      <td class="about-cell" onclick="toggleExpand('${a.slug}')">
        ${aboutContent}
      </td>
      <td class="status-cell">${statusPill(a.status)}</td>
    </tr>`;
  }).join('');

  const batchBtns = document.getElementById('batchBtns');
  const liUrls = filtered.filter(a => a.linkedin).map(a => a.linkedin);
  batchBtns.innerHTML = '';
  for (let i = 0; i < liUrls.length; i += 10) {
    const batch = liUrls.slice(i, i+10);
    const btn = document.createElement('button');
    btn.className = 'batch-btn';
    btn.textContent = `Open LinkedIn ${i+1}\u2013${Math.min(i+10, liUrls.length)}`;
    btn.onclick = (function(urls) {
      return function() {
        const script = urls.map(u => `window.open(${JSON.stringify(u)},'_blank');`).join('');
        const page = `<html><body><script>window.onload=function(){${script}window.close();}<\/script><p style="font-family:sans-serif;padding:20px">Opening ${urls.length} tabs\u2026</p></body></html>`;
        window.open(URL.createObjectURL(new Blob([page],{type:'text/html'})),'_blank');
      };
    })(batch);
    batchBtns.appendChild(btn);
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('metFilter').addEventListener('change', render);

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  });
});

render();
</script>
